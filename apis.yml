aid: virgin-money-uk
url: https://raw.githubusercontent.com/api-evangelist/virgin-money-uk/refs/heads/main/apis.yml
name: Virgin Money UK
kind: company
description: >-
  Virgin Money UK is a full-service UK retail and business bank, operating the
  Virgin Money, Clydesdale Bank, Yorkshire Bank, and B brands across personal
  current and savings accounts, mortgages, credit cards, and business banking.
  Formerly the FTSE-listed Virgin Money UK PLC (the former CYBG plc), it was
  acquired by Nationwide Building Society on 1 October 2024, making it part of a
  mutually owned group; its banking business is scheduled to transfer into
  Nationwide on 2 April 2026. The bank is authorised by the Prudential
  Regulation Authority and regulated by the FCA and PRA as an ASPSP. It is not
  one of the original CMA9 but is a fully participating UK Open Banking provider
  under PSD2 and the Payment Services Regulations 2017, publishing OBIE
  Read/Write Standard APIs - Account & Transaction Information (AIS), Payment
  Initiation (PIS), and Confirmation of Funds (CBPII) - through its developer
  portal at developer.virginmoney.com, split into "Merged" APIs (Virgin Money,
  Clydesdale and Yorkshire accounts, sort codes 05/82) and "Standalone" APIs
  (personal accounts and credit cards, sort code 08). Access is secured with
  FAPI-grade OAuth2/OpenID Connect, PSD2 strong customer authentication,
  mutual-TLS client authentication, and dynamic client registration using
  OBIE (OBWAC/OBSeal) or eIDAS (QWAC/QSEAL) certificates.
